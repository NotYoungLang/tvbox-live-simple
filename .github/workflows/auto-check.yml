name: Auto check live channels

on:
  schedule:
    # UTC times -> Beijing (UTC+8): 00:00->08:00, 12:00->20:00
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check channels and repair dead lines
        run: python check_channels.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && [ ! -f CHECK_REPORT.md ]; then
            echo "No changes"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: auto-check channels $(date -u +%Y-%m-%d)"
          git push
